# Runs the Chicago Morning Brief pipeline (both ingest scripts, dbt run, dbt test,
# render brief.md) by calling run_brief.sh. On main, commits the refreshed brief.md.
# Runs daily at 12:00 UTC (6 AM Chicago standard time, 7 AM daylight time), on pushes
# and pull requests to main, and on demand.
# Needs no secrets: both data sources are free and keyless.
name: Daily brief

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# Write access so runs on main can push brief.md. Pushes made with the workflow's
# own token do not trigger new runs, so this cannot loop.
permissions:
  contents: write

# One run at a time; a new run waits for the current one instead of overlapping.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: bash run_brief.sh

      # Only on main; pull request runs never commit.
      - name: Commit refreshed brief.md
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief.md
          if git diff --cached --quiet; then
            echo "brief.md unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Daily brief: $(TZ=America/Chicago date +%Y-%m-%d)"
          git push
